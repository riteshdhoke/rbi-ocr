# Alembic configuration.
#
# Deliberately inside alembic/ rather than at the repository root: the root is
# shared by every workstream and a file there is a merge conflict waiting to
# happen. Run migrations with an explicit -c:
#
#   .venv/Scripts/python.exe -m alembic -c alembic/alembic.ini upgrade head
#   .venv/Scripts/python.exe -m alembic -c alembic/alembic.ini revision --autogenerate -m "..."
#
# sqlalchemy.url is intentionally EMPTY. env.py reads DATABASE_URL through
# app.settings so the migration and the running service can never disagree
# about which database they mean, and so a password never lands in a tracked
# file. Override for a one-off with:
#
#   alembic -c alembic/alembic.ini -x url=postgresql+psycopg://... upgrade head

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
